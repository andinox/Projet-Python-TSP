services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: diagnostic
      POSTGRES_USER: diagnostic
      POSTGRES_PASSWORD: diagnostic
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    volumes:
      - ./DiagnosticTool:/app/DiagnosticTool
    environment:
      - DJANGO_ENV=production
      - POSTGRES_DB=diagnostic
      - POSTGRES_USER=diagnostic
      - POSTGRES_PASSWORD=diagnostic
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=False
      - EMAIL_HOST_USER=expertsdiagnostictool@gmail.com
      - EMAIL_HOST_PASSWORD=izyqlzfnwgbbolul
      - ENABLE=Admin123INT
      - ROUTER_USERNAME=admin
      - ROUTER_PWD=dkSDwa80f13faXcwxzj
      - ROUTER_PORT=22
      - ROUTER_IP=172.16.10.51
    depends_on:
      - db

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
:::