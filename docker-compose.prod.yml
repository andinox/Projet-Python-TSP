version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: diagnostic
      POSTGRES_USER: diagnostic
      POSTGRES_PASSWORD: diagnostic
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python DiagnosticTool/manage.py migrate &&
             python DiagnosticTool/manage.py collectstatic --noinput &&
             gunicorn DiagnosticTool.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
    environment:
      - DJANGO_ENV=production
      - POSTGRES_DB=diagnostic
      - POSTGRES_USER=diagnostic
      - POSTGRES_PASSWORD=diagnostic
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
