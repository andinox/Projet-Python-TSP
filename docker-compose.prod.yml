services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: diagnostic
      POSTGRES_USER: diagnostic
      POSTGRES_PASSWORD: diagnostic
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    volumes:
      - ./DiagnosticTool:/app/DiagnosticTool
      - static_volume:/app/DiagnosticTool/staticfiles
    environment:
      - DJANGO_ENV=production
      - POSTGRES_DB=diagnostic
      - POSTGRES_USER=diagnostic
      - POSTGRES_PASSWORD=diagnostic
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=False
      - EMAIL_HOST_USER=expertsdiagnostictool@gmail.com
      - EMAIL_HOST_PASSWORD=izyqlzfnwgbbolul
      - ENABLE=Admin123INT
      - ROUTER_USERNAME=admin
      - ROUTER_PWD=dkSDwa80f13faXcwxzj
      - ROUTER_PORT=22
      - ROUTER_IP=172.16.10.51
    depends_on:
      - db

  telegraf:
    image: telegraf:1.30
    volumes:
      - ./DiagnosticTool/core/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./DiagnosticTool/core/telegraf/telegraf.d:/etc/telegraf/telegraf.d:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    network_mode: "service:web"
    depends_on:
      - web

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/DiagnosticTool/staticfiles
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
