server {
    listen 80;
    server_name diagnostictool.h.minet.net 157.159.195.17;

    location /static/ {
        alias /app/DiagnosticTool/staticfiles/;
        access_log off;

    }

    location /media/ {
        alias /app/DiagnosticTool/media/;
        expires max;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}