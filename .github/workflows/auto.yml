name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit count and version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          x=$((count / 1000))
          y=$(((count / 100) % 10))
          z=$((count % 100))
          version="${x}.${y}.${z}"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push tag
