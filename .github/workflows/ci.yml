name: Security Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "--no-git --redact --exit-code 1"

      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Build Docker image
        run: docker build -t diagnostictool:ci .

      - name: Scan Docker image with Trivy
        uses: aquasec/trivy-action@0.32.0
        with:
          image: diagnostictool:ci
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: 1

      - name: Scan project files with Trivy
        uses: aquasec/trivy-action@0.64.1
        with:
          scan-type: 'fs'
          path: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: 1

      - name: Scan container images with Trivy
        uses: aquasec/trivy-action@0.64.1
        with:
          image-ref: "your-image-name:tag"
          format: "table"
          exit-code: 1
