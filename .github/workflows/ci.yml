name: Security Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "--no-git --redact --exit-code 1"
