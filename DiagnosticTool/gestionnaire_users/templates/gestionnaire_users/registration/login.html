{% extends "DiagnosticTool/base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="container-fluid" style="background-color: #c6d5ed; min-height: 100vh;">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-4" style="background-color: #ffffff; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);">

            <h2 class="text-center mb-3" style="color: #4f5891;"> Se connecter</h2>

            {% if form.errors %}
                <div style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
                    Nom d'utilisateur ou mot de passe incorrect.
                </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label" style="color: #1b203c;">Nom d'utilisateur :</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Votre nom d'utilisateur"
                        required >
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label" style="color: #1b203c;">Mot de passe :</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Votre mot de passe"
                        required>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn" style="background-color: #4f5891; color: white; border: none;">
                        Se connecter
                    </button>
                </div>
                <p class="text-center">
                    <a href="{% url 'password_reset_form' %}" style="color: #8b9de8; text-decoration: none;">
                        Mot de passe oublié ?
                    </a>
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
