[[inputs.snmp]]
  agents = ["172.16.10.51:161"]  # port SNMP 161
  version = 2
  community = "public"
  timeout = "10s"
  retries = 5

# infos interfaces

  [[inputs.snmp.table]]
    name = "interface_status"
    oid = "1.3.6.1.2.1.2.2"

    [[inputs.snmp.table.field]]
      name = "interface_index"
      oid = "1.3.6.1.2.1.2.2.1.1"

    [[inputs.snmp.table.field]]
      name = "interface_name"
      oid = "1.3.6.1.2.1.2.2.1.2"

    [[inputs.snmp.table.field]]
      name = "admin_status"
      oid = "1.3.6.1.2.1.2.2.1.7"

    [[inputs.snmp.table.field]]
      name = "oper_status"
      oid = "1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "last_change"
      oid = "1.3.6.1.2.1.2.2.1.9"

# ip des interfaces

  [[inputs.snmp.table]]
    name = "interface_ip"
    oid = "1.3.6.1.2.1.4.20"

    [[inputs.snmp.table.field]]
      name = "ip_address"
      oid = "1.3.6.1.2.1.4.20.1.1"

    [[inputs.snmp.table.field]]
      name = "interface_index"
      oid = "1.3.6.1.2.1.4.20.1.2"

# ARP table infos

  [[inputs.snmp.table]]
    name = "arp_table"
    oid = "1.3.6.1.2.1.4.22"  

    [[inputs.snmp.table.field]]
      name = "arp_ip"
      oid = "1.3.6.1.2.1.4.22.1.3"  

    [[inputs.snmp.table.field]]
      name = "arp_mac"
      oid = "1.3.6.1.2.1.4.22.1.2"  

    [[inputs.snmp.table.field]]
      name = "interface_index"
      oid = "1.3.6.1.2.1.4.22.1.1"

    [[inputs.snmp.table.field]]
      name = "subnet_mask"
      oid = "1.3.6.1.2.1.4.20.1.3"

# BGP infos

[[inputs.snmp.field]]
    name = "bgp_local_as"
    oid = "1.3.6.1.2.1.15.2"  

    [[inputs.snmp.table.field]]
      name = "peer_ip"
      oid = "1.3.6.1.2.1.15.3.1.7"  

    [[inputs.snmp.table.field]]
      name = "peer_as"
      oid = "1.3.6.1.2.1.15.3.1.9"  

    [[inputs.snmp.table.field]]
      name = "peer_status"
      oid = "1.3.6.1.2.1.15.3.1.2"  

    [[inputs.snmp.table.field]]
      name = "peer_last_change"
      oid = "1.3.6.1.2.1.15.3.1.19"  
