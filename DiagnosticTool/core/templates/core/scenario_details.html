{% extends 'DiagnosticTool/base.html' %}

{% block title %}{{scenario.name}}{% endblock %}

{% block content %}
<div class="header">
    <button class="back-button">Retourner </button>
</div>

<div class="container">
    <div class="scenario">
        <h2>Scénario</h2>
        <p class="description">{{scenario}}</p>
       <div class="placeholder-text">
                <p>{{scenario.description}}</p>
       </div>
        <button class="export-button">Exporter le rapport</button>
    </div>

    <div class="analysis">
        <h2>Analyse</h2>
        <div class="analysis-content">
            <p><strong class="alert">Alerte :</strong></p>
            <div class="placeholder-text">
                <p>blablabla</p>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block css %}
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
    }

    .header {
        background-color: #007bff;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .back-button {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        margin-left: 15px;
    }



    .container {
        display: flex;
        justify-content: space-between;
        padding: 40px;
        max-width: 1000px;
        margin: auto;
    }
    .back-button {
        color: #ffffff;
    }
    .scenario, .analysis {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        flex: 1;
    }

    .analysis {
        margin-left: 20px;
        border: 1px solid #ccc;
        overflow: auto;
    }

    h2 {
        color: black;
    }

    .description {
        color: #007bff;
        font-weight: bold;
    }

    .placeholder-text {
        height: 20px;
        background-color: #dce7ff;
        margin: 10px 0;
        border-radius: 5px;
        width: 80%;
    }


    .export-button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        margin-top: 20px;
        cursor: pointer;
        border-radius: 5px;
        transition: background 0.3s;
    }

    .export-button:hover {
        background-color: #0056b3;
    }

    .analysis-content {
        padding: 10px;
    }

    .alert {
        color: #007bff;
    }
</style>
{% endblock %}
