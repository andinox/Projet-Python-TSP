{% extends 'DiagnosticTool/base.html' %}

{% block title %}{{scenario.name}}{% endblock %}
{% block header %}
        <a href="{%url 'home'%}" >Retourner</a>

{% endblock %}
{% block content %}


<div class="container">
    <div class="scenario">
        <h2>Scénario</h2>
        <p class="description">{{scenario}}</p>
       <div class="placeholder-text">
                <p>{{scenario.description}}</p>
       </div>
        <button type="submit" class="diagno-button">Lancer le diagnostic</button>

    </div>

    <div class="analysis">
        <h2>Analyse</h2>
        <div class="analysis-content">
            <p><strong class="alert">Alerte :</strong></p>
            <div class="placeholder-text">
                <p>blablabla</p>
            </div>
            <button class="export-button">Exporter le rapport en format PDF</button>

        </div>
    </div>


</div>
{% endblock %}
